.g>div{

  border-radius:4px;
  pointer-events:none;
  transform-origin:0 0;
  opacity:0;
  transition:opacity .5s,transform .3s,left .3s,top .3s;
}
.g>div[data-t].s::after{
  left:calc(16px*var(--w)/var(--ww));
