<style>*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--s:calc(100vw / 390px)}
body{
  background:#000;
  color:#fff;
  overscroll-behavior-y:contain;
  touch-action:pan-y;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}
h1{
  padding:16px;
  font-size:18px;
  font-weight:400;
}
p{
  padding:0 16px 16px;
}
h2{
  position:sticky;
  top:0;
  z-index:3;
  background:#222;
  padding:8px 16px;
  font-size:14px;
  font-weight:400;
}
.g{
  position:relative;
  width:100vw;
  height:calc(var(--gh)*var(--s)*1px);
}
.g>div{
  position:absolute;
  left:calc(var(--x)*var(--s)*1px);
  width:calc(var(--w)*var(--s)*1px);
  top:calc(var(--y)*var(--s)*1px);
  height:calc(var(--h)*var(--s)*1px);
  overflow:hidden;
  content-visibility:auto;
  contain-intrinsic-size:calc(var(--w)*var(--s)*1px) calc(var(--h)*var(--s)*1px);
  cursor:pointer;
  scroll-margin-top:40px;
  -webkit-tap-highlight-color:transparent;
  background-image:url(../sprites/716506-16.png);
  background-repeat:no-repeat;
  background-size:calc(10*var(--w)*var(--s)*1px) calc(8*var(--h)*var(--s)*1px);
  background-position:calc(var(--c)*var(--w)*var(--s)*-1px) calc(var(--r)*var(--h)*var(--s)*-1px);
}
.g>div.s{
  left:0;
  width:100vw;
  height:calc(100vw * var(--h) / var(--w));
  z-index:100;
  transition:left .3s,width .3s,height .3s;
}
.g>div img{
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}
.g>div[data-t]::after{
  content:attr(data-t);
  position:absolute;
  left:16px;
  top:16px;
  z-index:2;
  padding:6px 10px;
  max-width:min(calc(100% - 32px), 480px);
  overflow-wrap:break-word;
  background:rgba(0,0,0,.8);
  font-size:14px;
  border-radius:4px;
  pointer-events:none;
  opacity:0;
  transition:opacity .5s;
}
.g>div[data-t].s::after{opacity:1;transition:opacity 0s}
@media (hover:hover){
  .g>div:hover{outline:1px solid rgba(255,255,255,.2)}
}</style>
