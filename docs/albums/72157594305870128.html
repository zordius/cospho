.g>div{

  transform-origin:0 0;
  opacity:0;
  transition:opacity .5s,transform .3s,left .3s,top .3s;
}
.g>div[data-t].s::after{

  transform:scale(calc(var(--w)/var(--ww)));

  transition:opacity 0s,transform .3s,left .3s,top .3s;
