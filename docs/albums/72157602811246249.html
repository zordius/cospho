  width:100vw;
  height:calc(100vw * var(--h) / var(--w));

}
.g>div img{
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}
.g>div[data-t]::after{
  content:attr(data-t);
  position:absolute;
  left:16px;
  top:16px;

  pointer-events:none;
  opacity:0;
  transition:opacity .5s;
}
.g>div[data-t].s::after{opacity:1;transition:opacity 0s}
@media (hover:hover){
