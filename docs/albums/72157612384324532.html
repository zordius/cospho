<style>*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

body{

.g{
  position:relative;
  width:100vw;
  height:calc(var(--gh)*var(--s)*1px);
}
.g>div{
  position:absolute;
  left:calc(var(--x)*var(--s)*1px);
  width:calc(var(--w)*var(--s)*1px);
  top:calc(var(--y)*var(--s)*1px);
  height:calc(var(--h)*var(--s)*1px);

  content-visibility:auto;
  contain-intrinsic-size:calc(var(--w)*var(--s)*1px) calc(var(--h)*var(--s)*1px);
  cursor:pointer;
  z-index:0;
  -webkit-tap-highlight-color:transparent;
  scroll-margin-bottom:calc(var(--h)*var(--s)*(var(--ww) - var(--w))/var(--w)*1px);
  transform-origin:0 0;
  transition:transform .3s,z-index 0s .3s;

}
.g>div.s{
  z-index:100;
  transform:translate(calc(var(--x)*var(--s)*-1px),0) scale(calc(var(--ww)/var(--w)));
  transition:transform .3s,z-index 0s 0s;
}
.g>div img{
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}
.g>div[data-t]::after{
  content:attr(data-t);
  position:absolute;
  left:16px;
  top:16px;
  z-index:2;
  padding:6px 10px;
  max-width:min(calc(100% - 32px), 480px);
  overflow-wrap:break-word;
  background:rgba(0,0,0,.8);
  font-size:14px;
  border-radius:4px;
  pointer-events:none;
  transform-origin:0 0;
  opacity:0;
  transition:opacity .5s,transform .3s,left .3s,top .3s;
}
.g>div[data-t].s::after{
  left:calc(16px*var(--w)/var(--ww));
  top:calc(16px*var(--w)/var(--ww));
  max-width:min(calc(100vw - 32px),480px);
  transform:scale(calc(var(--w)/var(--ww)));
  opacity:1;
  transition:opacity 0s,transform .3s,left .3s,top .3s;
}
@media (hover:hover){
  .g>div:hover{outline:1px solid rgba(255,255,255,.2)}
}</style>

const F="https://live.staticflickr.com/3";const p=innerWidth*devicePixelRatio>=702?1:0;
const o=new IntersectionObserver(es=>{for(const e of es){const i=e.target;if(e.isIntersecting){if(!i.src||i.src===T){i.decoding='async';const u=i.dataset.src.split(',');i.src=F+(u[p]||u[0])}}else if(i.src&&i.src!==T){if(i.complete)o.unobserve(i);else i.src=T}}},{rootMargin:'200px 0px'});
for(const i of document.images)if(i.dataset.src&&!i.src)o.observe(i);
document.body.addEventListener('click',e=>{let d=e.target.closest('.g>div');if(!d)return;if(d.classList.contains('s')){const a=document.querySelectorAll('.g>div');const t=a[[].indexOf.call(a,d)+(e.clientX<innerWidth/2?-1:1)];if(!t)return;clearTimeout(d._t);d.classList.remove('s');d=t}d.scrollIntoView({behavior:'smooth',block:'end'});clearTimeout(d._t);d.classList.add('s');d._t=setTimeout(()=>d.classList.remove('s'),3000)});
</script>
