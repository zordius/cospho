<style>*{margin:0;padding:0;box-sizing:border-box}
:root{--s:calc(100vw / 390px)}
body{

.g{
  position:relative;
  width:100vw;
  height:calc(70436*var(--s)*1px);
}
.g>div{
  position:absolute;
  left:0;
  width:100vw;
  top:calc(var(--y)*var(--s)*1px);
  height:calc(var(--h)*var(--s)*1px);
  overflow:hidden;
  content-visibility:auto;
  contain-intrinsic-size:100vw calc(var(--h)*var(--s)*1px);

  -webkit-tap-highlight-color:transparent;
  background-image:url(../sprites/72157651615359222-16.png);
  background-repeat:no-repeat;
  background-size:calc(10*100vw) calc(13*var(--h)*var(--s)*1px);
  background-position:calc(var(--c)*100vw*-1) calc(var(--r)*var(--h)*var(--s)*-1px);
}
.g>div img{
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}
.g>div[data-t]::after{
  content:attr(data-t);
  position:absolute;
  left:16px;
  top:16px;
  z-index:2;
  padding:10px 16px;
  background:rgba(0,0,0,.8);
  font-size:14px;
  border-radius:4px;
  pointer-events:none;
  opacity:0;
  transition:opacity .5s;
}
.g>div[data-t].s::after{opacity:1;transition:opacity 0s}
@media (hover:hover){
  .g>div:hover{outline:1px solid rgba(255,255,255,.2)}
}</style>
