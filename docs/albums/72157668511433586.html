.g>div{

  background-position:calc(var(--c)*var(--w)*var(--s)*-1px) calc(var(--r)*var(--h)*var(--s)*-1px);
}
.g>div.s{
  left:0;
  width:100vw;
  height:calc(100vw * var(--h) / var(--w));
  z-index:100;
  transition:left .3s,width .3s,height .3s;
}
.g>div img{
  display:block;
  width:100%;
  height:100%;
  pointer-events:none;
}
.g>div[data-t]::after{
  content:attr(data-t);
  position:absolute;

  top:16px;

  background:rgba(0,0,0,.8);
  font-size:14px;
  border-radius:4px;
  pointer-events:none;
  opacity:0;
  transition:opacity .5s;
}
.g>div[data-t].s::after{opacity:1;transition:opacity 0s}
@media (hover:hover){
  .g>div:hover{outline:1px solid rgba(255,255,255,.2)}
}</style>
